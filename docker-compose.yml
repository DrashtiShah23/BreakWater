# Breakwater local stack (zero-cost).
# Milestone 6: Envoy TLS + routing + active health checks / timeouts / retries.
# Redis, rate limit, Prometheus, Grafana: later milestones.

services:
  upstream-api:
    build:
      context: ./services/upstream
    image: breakwater-upstream:local
    environment:
      SURFACE: api
      UPSTREAM_INSTANCE_ID: api-1
      ENABLE_TEST_CONTROLS: "true"
      LOG_LEVEL: INFO
    ports:
      - "${UPSTREAM_API_PORT:-9001}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Second API instance for active health-check removal / recovery demos.
  upstream-api-2:
    image: breakwater-upstream:local
    depends_on:
      upstream-api:
        condition: service_started
    environment:
      SURFACE: api
      UPSTREAM_INSTANCE_ID: api-2
      ENABLE_TEST_CONTROLS: "true"
      LOG_LEVEL: INFO
    ports:
      - "${UPSTREAM_API_2_PORT:-9003}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  upstream-status:
    image: breakwater-upstream:local
    depends_on:
      upstream-api:
        condition: service_started
    environment:
      SURFACE: status
      UPSTREAM_INSTANCE_ID: status-1
      ENABLE_TEST_CONTROLS: "true"
      LOG_LEVEL: INFO
    ports:
      - "${UPSTREAM_STATUS_PORT:-9002}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  envoy:
    image: envoyproxy/envoy:v1.31.5
    depends_on:
      upstream-api:
        condition: service_healthy
      upstream-api-2:
        condition: service_healthy
      upstream-status:
        condition: service_healthy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/tls:/etc/envoy/tls:ro
    command:
      - /usr/local/bin/envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - info
    ports:
      - "${ENVOY_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${ENVOY_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${ENVOY_ADMIN_PORT:-9901}:9901"
