# Breakwater local stack (zero-cost).
# Milestone 3: Envoy plaintext reverse proxy + sample upstreams.
# TLS, host routing, Redis, rate limit, Prometheus, Grafana: later milestones.

services:
  upstream-api:
    build:
      context: ./services/upstream
    image: breakwater-upstream:local
    environment:
      SURFACE: api
      UPSTREAM_INSTANCE_ID: api-1
      ENABLE_TEST_CONTROLS: "true"
      LOG_LEVEL: INFO
    ports:
      - "${UPSTREAM_API_PORT:-9001}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Same image as upstream-api (built once). Avoid concurrent dual-build races.
  upstream-status:
    image: breakwater-upstream:local
    depends_on:
      upstream-api:
        condition: service_started
    environment:
      SURFACE: status
      UPSTREAM_INSTANCE_ID: status-1
      ENABLE_TEST_CONTROLS: "true"
      LOG_LEVEL: INFO
    ports:
      - "${UPSTREAM_STATUS_PORT:-9002}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  envoy:
    image: envoyproxy/envoy:v1.31.5
    depends_on:
      upstream-api:
        condition: service_healthy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command:
      - /usr/local/bin/envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - info
    ports:
      # Data-plane listener (client traffic through the edge).
      - "${ENVOY_HTTP_PORT:-8080}:8080"
      # Control-plane admin (bind to localhost on the host).
      - "127.0.0.1:${ENVOY_ADMIN_PORT:-9901}:9901"
    # Official Envoy image has no curl/wget; readiness is polled from the host
    # via admin /ready in smoke and integration tests.
