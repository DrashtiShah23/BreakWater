# Breakwater Envoy edge — Milestone 5: host + path routing.
#
# Data path:
#   Client --HTTPS--> Envoy :8443 (TLS terminate)
#         --HTTP--> upstream-api | upstream-status (by Host)
#
# Control:
#   Admin :9901 (127.0.0.1 on host)
#   Plaintext :8080 debug listener (127.0.0.1 on host only)
#   Test controls: direct to upstream ports — NOT routed via Envoy
#
# Rate-limit route class (standard/sensitive) is NOT encoded here.
# Host identity ≠ failure-policy class (see docs/routing_table.md).
#
# Deferred: active HC polish (M6), Redis/RL (M7–8), Prometheus (M9).

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: listener_https_data
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/tls/server.crt
                    private_key:
                      filename: /etc/envoy/tls/server.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO
                generate_request_id: true
                preserve_external_request_id: true
                request_id_extension:
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                    pack_trace_reason: false
                internal_address_config: {}
                common_http_protocol_options:
                  idle_timeout: 60s
                route_config:
                  name: local_route_https
                  virtual_hosts:
                    - name: api_breakwater_local
                      domains:
                        - "api.breakwater.local"
                        - "api.breakwater.local:*"
                      routes:
                        - match:
                            path: "/health"
                          route:
                            cluster: upstream_api
                            timeout: 5s
                        - match:
                            path: "/live"
                          route:
                            cluster: upstream_api
                            timeout: 5s
                        - match:
                            path: "/api/v1/items"
                          route:
                            cluster: upstream_api
                            timeout: 15s
                        - match:
                            path: "/api/v2/items"
                          route:
                            cluster: upstream_api
                            timeout: 15s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_path","host":"api.breakwater.local","edge":"breakwater-envoy"}'

                    - name: status_breakwater_local
                      domains:
                        - "status.breakwater.local"
                        - "status.breakwater.local:*"
                      routes:
                        - match:
                            path: "/health"
                          route:
                            cluster: upstream_status
                            timeout: 5s
                        - match:
                            path: "/live"
                          route:
                            cluster: upstream_status
                            timeout: 5s
                        - match:
                            path: "/api/v1/status"
                          route:
                            cluster: upstream_status
                            timeout: 5s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_path","host":"status.breakwater.local","edge":"breakwater-envoy"}'

                    # Last: any other Host header.
                    - name: unknown_host
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_host","edge":"breakwater-envoy"}'

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: |
                            [data-https] %START_TIME% %REQ(:METHOD)% host=%REQ(:AUTHORITY)% req_id=%REQ(X-REQUEST-ID)% path=%REQ(:PATH)% resp=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_HOST% duration_ms=%DURATION%

    # Local-dev plaintext debug only (compose binds 127.0.0.1). Same routing contract; no /__test__/.
    - name: listener_http_debug
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http_debug
                codec_type: AUTO
                generate_request_id: true
                preserve_external_request_id: true
                request_id_extension:
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                    pack_trace_reason: false
                internal_address_config: {}
                route_config:
                  name: local_route_http_debug
                  virtual_hosts:
                    - name: api_breakwater_local_debug
                      domains:
                        - "api.breakwater.local"
                        - "api.breakwater.local:*"
                      routes:
                        - match:
                            path: "/health"
                          route:
                            cluster: upstream_api
                            timeout: 5s
                        - match:
                            path: "/live"
                          route:
                            cluster: upstream_api
                            timeout: 5s
                        - match:
                            path: "/api/v1/items"
                          route:
                            cluster: upstream_api
                            timeout: 15s
                        - match:
                            path: "/api/v2/items"
                          route:
                            cluster: upstream_api
                            timeout: 15s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_path","host":"api.breakwater.local","edge":"breakwater-envoy"}'
                    - name: status_breakwater_local_debug
                      domains:
                        - "status.breakwater.local"
                        - "status.breakwater.local:*"
                      routes:
                        - match:
                            path: "/health"
                          route:
                            cluster: upstream_status
                            timeout: 5s
                        - match:
                            path: "/live"
                          route:
                            cluster: upstream_status
                            timeout: 5s
                        - match:
                            path: "/api/v1/status"
                          route:
                            cluster: upstream_status
                            timeout: 5s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_path","host":"status.breakwater.local","edge":"breakwater-envoy"}'
                    - name: unknown_host_debug
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_host","edge":"breakwater-envoy"}'
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: upstream_api
      connect_timeout: 2s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: upstream_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: upstream-api
                      port_value: 8000

    - name: upstream_status
      connect_timeout: 2s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: upstream_status
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: upstream-status
                      port_value: 8000
