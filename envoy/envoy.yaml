# Breakwater Envoy edge — Milestone 6: health checks, timeouts, retries.
#
# Data path:
#   Client --HTTPS--> Envoy :8443 (TLS terminate)
#         --HTTP--> healthy upstream-api | upstream-status members
#
# Control:
#   Admin :9901 — inspect /clusters health
#   Active HC GET /health — not client data traffic
#   /__test__/* — direct upstream ports only (not Envoy-routed)
#
# See docs/adr/0006-retry-timeout-health.md and docs/failure_model.md.

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: listener_https_data
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/tls/server.crt
                    private_key:
                      filename: /etc/envoy/tls/server.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO
                generate_request_id: true
                preserve_external_request_id: true
                always_set_request_id_in_response: true
                request_id_extension:
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                    pack_trace_reason: false
                internal_address_config: {}
                common_http_protocol_options:
                  idle_timeout: 60s
                route_config:
                  name: local_route_https
                  virtual_hosts:
                    - name: api_breakwater_local
                      domains:
                        - "api.breakwater.local"
                        - "api.breakwater.local:*"
                      routes:
                        - match:
                            path: "/health"
                          route:
                            cluster: upstream_api
                            timeout: 2s
                        - match:
                            path: "/live"
                          route:
                            cluster: upstream_api
                            timeout: 2s
                        # Idempotent GET — bounded transport retries only (not HTTP 5xx).
                        - match:
                            path: "/api/v1/items"
                          route:
                            cluster: upstream_api
                            timeout: 3s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,reset
                              num_retries: 2
                              per_try_timeout: 1s
                              retry_back_off:
                                base_interval: 0.05s
                                max_interval: 0.25s
                        - match:
                            path: "/api/v2/items"
                          route:
                            cluster: upstream_api
                            timeout: 3s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,reset
                              num_retries: 2
                              per_try_timeout: 1s
                              retry_back_off:
                                base_interval: 0.05s
                                max_interval: 0.25s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_path","host":"api.breakwater.local","edge":"breakwater-envoy"}'

                    - name: status_breakwater_local
                      domains:
                        - "status.breakwater.local"
                        - "status.breakwater.local:*"
                      routes:
                        - match:
                            path: "/health"
                          route:
                            cluster: upstream_status
                            timeout: 2s
                        - match:
                            path: "/live"
                          route:
                            cluster: upstream_status
                            timeout: 2s
                        - match:
                            path: "/api/v1/status"
                          route:
                            cluster: upstream_status
                            timeout: 2s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_path","host":"status.breakwater.local","edge":"breakwater-envoy"}'

                    - name: unknown_host
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_host","edge":"breakwater-envoy"}'

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: |
                            [data-https] %START_TIME% %REQ(:METHOD)% host=%REQ(:AUTHORITY)% req_id=%REQ(X-REQUEST-ID)% path=%REQ(:PATH)% resp=%RESPONSE_CODE% flags=%RESPONSE_FLAGS% upstream=%UPSTREAM_HOST% duration_ms=%DURATION%

    - name: listener_http_debug
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http_debug
                codec_type: AUTO
                generate_request_id: true
                preserve_external_request_id: true
                always_set_request_id_in_response: true
                request_id_extension:
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                    pack_trace_reason: false
                internal_address_config: {}
                route_config:
                  name: local_route_http_debug
                  virtual_hosts:
                    - name: api_breakwater_local_debug
                      domains:
                        - "api.breakwater.local"
                        - "api.breakwater.local:*"
                      routes:
                        - match:
                            path: "/health"
                          route:
                            cluster: upstream_api
                            timeout: 2s
                        - match:
                            path: "/live"
                          route:
                            cluster: upstream_api
                            timeout: 2s
                        - match:
                            path: "/api/v1/items"
                          route:
                            cluster: upstream_api
                            timeout: 3s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,reset
                              num_retries: 2
                              per_try_timeout: 1s
                              retry_back_off:
                                base_interval: 0.05s
                                max_interval: 0.25s
                        - match:
                            path: "/api/v2/items"
                          route:
                            cluster: upstream_api
                            timeout: 3s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,reset
                              num_retries: 2
                              per_try_timeout: 1s
                              retry_back_off:
                                base_interval: 0.05s
                                max_interval: 0.25s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_path","host":"api.breakwater.local","edge":"breakwater-envoy"}'
                    - name: status_breakwater_local_debug
                      domains:
                        - "status.breakwater.local"
                        - "status.breakwater.local:*"
                      routes:
                        - match:
                            path: "/health"
                          route:
                            cluster: upstream_status
                            timeout: 2s
                        - match:
                            path: "/live"
                          route:
                            cluster: upstream_status
                            timeout: 2s
                        - match:
                            path: "/api/v1/status"
                          route:
                            cluster: upstream_status
                            timeout: 2s
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_path","host":"status.breakwater.local","edge":"breakwater-envoy"}'
                    - name: unknown_host_debug
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"unknown_host","edge":"breakwater-envoy"}'
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: upstream_api
      connect_timeout: 1s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      ignore_health_on_host_removal: false
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            retry_budget:
              budget_percent:
                value: 20.0
              min_retry_concurrency: 1
      health_checks:
        - timeout: 1s
          interval: 2s
          no_traffic_interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 2
          always_log_health_check_failures: true
          http_health_check:
            path: "/health"
      load_assignment:
        cluster_name: upstream_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: upstream-api
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: upstream-api-2
                      port_value: 8000

    - name: upstream_status
      connect_timeout: 1s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      ignore_health_on_host_removal: false
      health_checks:
        - timeout: 1s
          interval: 2s
          no_traffic_interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 2
          always_log_health_check_failures: true
          http_health_check:
            path: "/health"
      load_assignment:
        cluster_name: upstream_status
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: upstream-status
                      port_value: 8000
